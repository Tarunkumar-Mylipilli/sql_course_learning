<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SQLMastery Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404s to index.html with the route encoded
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var targetPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
      var query = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      if (query.toLowerCase().includes('admin')) {
        l.replace(targetPath + 'admin.html' + l.hash);
      } else {
        l.replace(targetPath + (query ? '?' + query : '') + l.hash);
      }
    </script>
  </head>
  <body style="background:#080b11;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
    <p>Redirecting to SQLMastery...</p>
  </body>
</html>
